name: Release Build Self-Hosted

on:
  workflow_dispatch:

jobs:
  release:
    name: Build release assets
    runs-on:
      - self-hosted
      - windows
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Preflight whitespace
        shell: powershell
        run: git diff --check

      - name: Build release
        shell: powershell
        run: make -C SRC release

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: r-yors-release-assets
          path: RELEASE/
          retention-days: 30
